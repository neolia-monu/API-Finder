<!-- @format -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AI-Powered API Catalog</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <img src="assets/NatWest/nwb_white.svg" alt="NatWest Logo" />
      <h1>AI-Powered API Catalog</h1>

      <nav>
        <div id="tabHome" class="tab active">Home</div>
        <div id="tabRec" class="tab">Recommendations</div>
      </nav>
    </header>

    <main>
      <div class="content">
        <div class="left-col">
          <!-- HOME view -->
          <div id="viewHome">
            <div
              style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                max-width: 1100px;
                width: 100%;
                margin-bottom: 12px;
              ">
              <div>
                <div class="muted">All registered APIs</div>
                <h2 style="margin: 6px 0 0 0">API index</h2>
              </div>
              <div style="display: flex; gap: 8px; align-items: center">
                <button
                  id="refreshBtn"
                  class="btn"
                  style="
                    background: #42145f;
                    padding: 8px 16px;
                    font-weight: 800;
                  ">
                  Refresh
                </button>
              </div>
            </div>

            <div id="cards" class="cards">
              <!-- api cards injected here -->
            </div>
          </div>

          <!-- RECOMMENDATIONS view (hidden by default) -->
          <div id="viewRec" style="display: none">
            <div style="max-width: 1100px; width: 100%">
              <div class="search-container">
                <textarea
                  id="recQuery"
                  class="search-textarea"
                  placeholder="Describe what you need (paragraphs allowed)."></textarea>
                <div class="search-actions">
                  <button id="runRec" class="btn">Search</button>
                  <div
                    id="recStatus"
                    class="muted"
                    style="
                      margin-left: 12px;
                      display: flex;
                      align-items: center;
                    "></div>
                </div>
              </div>

              <div id="search" class="muted" style="margin-top: 18px"></div>
              <div id="recResults" style="margin-top: 18px">
                <!-- recommendation cards inserted here -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
