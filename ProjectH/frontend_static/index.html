<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI-Powered API Search</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Roboto, system-ui;
      background: #f9fafb;
      color: #111827;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ===== Header ===== */
    header {
      background: #42145F; /* Scarlet Gum */
      padding: 18px 40px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 20px;
      box-shadow: 0 6px 10px rgba(0,0,0,0.1);
    }
    header img {
      height: 90px; /* Bigger image */
      width: 190px;
      object-fit: contain;
      border-radius: 8px;
    }
    header h1 {
      font-size: 1.8rem;
      font-weight: 600;
      margin: 0;
      color: #FFFFFF;
      letter-spacing: 0.5px;
    }

    /* ===== Main layout ===== */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 16px;
    }

    /* ===== Search box ===== */
    .search-container {
      display: flex;
      flex-direction: column; /* button will sit under textarea inside same rounded container */
      align-items: stretch;
      background: #FFFFFF;
      border-radius: 30px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      padding: 18px;
      width: 100%;
      max-width: 720px;
      border: 2px solid #009FAC; /* Bondi Blue outline */
    }

    /* multiline textarea with wrapping */
    .search-container textarea {
      resize: vertical;
      border: none;
      outline: none;
      font-size: 1rem;
      padding: 14px 16px;
      border-radius: 14px;
      color: #111827;
      background: #f1f5f9;
      margin-bottom: 12px;
      min-height: 90px;
      max-height: 260px;
      line-height: 1.5;
      overflow-y: auto;
      white-space: pre-wrap; /* allow wrapping */
      word-wrap: break-word;
    }

    /* center the button but keep it inside the same curved box */
    .search-container .btn-row {
      display: flex;
      justify-content: center;
      margin-top: 6px;
    }
    .search-container button {
      background: #42145F; /* Brick Red */
      color: #FFFFFF;
      border: none;
      padding: 13px 28px;
      border-radius: 9999px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s, transform 0.08s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }
    .search-container button:hover {
      background: #b12f48;
      transform: translateY(-1px);
    }

    /* ===== Status + Result ===== */
    .status {
      margin-top: 18px;
      color: #475569;
      font-size: 0.95rem;
    }
    .result-section {
      width: 100%;
      max-width: 920px;
      margin-top: 28px;
      display: none; /* hidden until response */
    }
    pre {
      background: #0b1220;
      color: #e6eef8;
      padding: 14px;
      border-radius: 10px;
      overflow-x: auto;
      white-space: pre-wrap;
      border-left: 4px solid #009FAC; /* accent stripe */
    }

    /* small responsive tweaks */
    @media (max-width: 760px) {
      header { padding: 12px 18px; gap: 12px; }
      header img { height: 64px; width: 140px; }
      .search-container { padding: 14px; max-width: 92%; }
    }
  </style>
</head>
<body>
  <header>
    <img src="assets/NatWest/nwb_white.svg" alt="NatWest Logo">
    <h1>AI-Powered API Recommendation</h1>
  </header>

  <main>
    <div class="search-container">
      <!-- textarea supports multi-line paragraphs and word-wrap -->
      <textarea id="query" placeholder="Type your API search / description here."></textarea>

      <div class="btn-row">
        <button id="searchBtn">Search</button>
      </div>
    </div>

    <div class="status" id="status"></div>

    <div class="result-section" id="resultSection">
      <pre id="out"></pre>
    </div>
  </main>

<script>
const API_URL = "http://127.0.0.1:3000/enrich";
const textarea = document.getElementById('query');
const out = document.getElementById('out');
const status = document.getElementById('status');
const resultSection = document.getElementById('resultSection');
const btn = document.getElementById('searchBtn');

// Submit on Enter (no shift). Allow Shift+Enter for newline.
textarea.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    runSearch();
  }
});

btn.addEventListener('click', runSearch);

async function runSearch() {
  const query = textarea.value.trim();
  if (!query) {
    alert("Please enter a search term or description.");
    textarea.focus();
    return;
  }

  out.textContent = "";
  resultSection.style.display = "none";
  status.textContent = "Searching...";

  try {
    const payload = { query };
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const text = await res.text();
    if (!res.ok) throw new Error(text || res.statusText);

    const data = JSON.parse(text);
    out.textContent = JSON.stringify(data, null, 2);
    resultSection.style.display = "block"; // show results only after response
    status.textContent = "✅ Found " + (data.total_matches ?? 0) + " result(s)";
  } catch (err) {
    status.textContent = "❌ Error: " + err.message;
    resultSection.style.display = "none";
  }
}
</script>
</body>
</html>
